# Source of truth for the app config; `doctl apps update --spec` does a full replace.
name: explainshell
region: nyc
domains:
  - domain: explainshell.com
    type: PRIMARY
services:
  - name: web
    dockerfile_path: prod/docker/Dockerfile
    source_dir: /
    log_destinations:
      - name: datadog
        datadog:
          endpoint: https://http-intake.logs.datadoghq.com/api/v2/logs
          api_key: ${DATADOG_API_KEY}
    github:
      repo: idank/explainshell
      branch: master
      # CI deploys pin DB_NAME from the db-latest release; auto-deploy would skip that.
      deploy_on_push: false
    http_port: 8080
    instance_count: 2
    # Cheapest slug that allows instance_count > 1.
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /health
      initial_delay_seconds: 60
      period_seconds: 10
      timeout_seconds: 10
      failure_threshold: 5
    envs:
      # App-level runtime config (DEBUG, DB_PATH) is baked into the image
      # so local runs match prod exactly; only deploy-time values live here.
      # Build args, rendered by envsubst in CI.
      - key: DB_NAME
        value: ${DB_NAME}
        scope: BUILD_TIME
      - key: GIT_SHA
        value: ${GIT_SHA}
        scope: BUILD_TIME
